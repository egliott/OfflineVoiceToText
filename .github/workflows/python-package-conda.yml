name: Python Package using Conda (Windows)

on: [push]

jobs:
  build-windows: # Cambiato il nome del job
    runs-on: windows-latest # CAMBIAMENTO CRITICO: Esegue su un ambiente Windows
    strategy:
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Conda Environment (Windows)
        # Questo action è specifico per configurare Conda su Windows/Linux/macOS
        # e funziona meglio di setup-python per ambienti Conda complessi.
        uses: conda-incubator/setup-miniconda@v3 
        with:
          # Versione Python da utilizzare nell'ambiente Conda
          python-version: '3.10'
          # Aggiunge Conda e Python al PATH (richiesto su Windows)
          auto-activate-base: true
          # Aggiunge le librerie al base environment
          miniforge-variant: Mamba
          miniforge-version: latest
          
      - name: Install dependencies
        # Su Windows, i comandi Conda sono disponibili direttamente dopo l'action setup-miniconda.
        # Usa 'mamba' per una risoluzione più veloce dei pacchetti.
        run: mamba env update --file environment.yml --name base

      - name: Lint with flake8
        # Conda è già nel PATH e l'ambiente base è attivo.
        run: |
          mamba install flake8 -y
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          mamba install pytest -y
          pytest
